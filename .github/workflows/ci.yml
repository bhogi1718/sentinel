name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (typecheck, lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Tests (no external database needed)
        run: npm test
      - run: npm run build

  frontend:
    name: Frontend (typecheck, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm run build

  agent:
    name: "Agent (Windows: build, tests, clippy)"
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
      - run: cargo build --release
      - run: cargo test
      # Reported, not yet blocking: five existing lints (dead code in the
      # helper binary, one field-reassign). Making this blocking is a
      # follow-up once they are fixed.
      - run: cargo clippy --all-targets
        continue-on-error: true

  dependency-audit:
    name: Dependency audit (production dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Reported, not yet blocking: the backend has known advisories in
      # bcrypt's install-time tooling (see PRODUCT_AUDIT.md, M1). Make this
      # blocking once they are resolved.
      - name: Backend
        working-directory: backend
        run: npm ci --omit=dev && npm audit --omit=dev --audit-level=high
        continue-on-error: true
      - name: Frontend
        working-directory: frontend
        run: npm ci --omit=dev && npm audit --omit=dev --audit-level=high
        continue-on-error: true
