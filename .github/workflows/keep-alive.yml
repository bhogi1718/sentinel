name: Keep Render backend awake

# Render's free web-service tier sleeps after ~15 minutes with no traffic.
# Pinging /health every 10 minutes keeps it under that threshold so the
# agent's persistent Socket.IO connection never gets dropped by a sleep.
#
# GOTCHA: GitHub disables scheduled workflows automatically after 60 days
# with no repo activity (pushes, etc.). If the backend suddenly starts
# showing as asleep/offline after a long quiet period, check
# Actions -> this workflow -> re-enable, before assuming anything broke.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -fsS "${{ vars.RENDER_BACKEND_URL }}/health"
